name: iNoU CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript & Browser Bundles
        run: npm run build

      - name: Run Full Specification Test Suites (59 Tests)
        run: node --test tests/*.test.js

      - name: Deployment Dry Run Validation
        run: node scripts/deploy.js dry-run

  deploy-cloud-relay:
    needs: verify-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Distribution
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Fix 1.1: Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fix 1.1: Build and PUSH image to registry (was push: false)
      - name: Build & Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/inuo-cloud-hub:latest
            ghcr.io/${{ github.repository_owner }}/inuo-cloud-hub:${{ github.sha }}

      # Fix 1.2 & 1.3: SSH into server, write .env from secrets, pull and restart
      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/inuo
            printf 'GEMINI_API_KEY=%s\nINUO_DOMAIN=%s\nNODE_ENV=production\nGEMINI_MODEL=%s\nDEBUG_LEVEL=1\n' \
              "${{ secrets.GEMINI_API_KEY }}" \
              "${{ secrets.INUO_DOMAIN }}" \
              "${{ secrets.GEMINI_MODEL || 'gemini-flash-latest' }}" > .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
